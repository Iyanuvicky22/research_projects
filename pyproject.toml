[project]
name = "researchs"
version = "0.1.0"
description = "Research Projects"
authors = [
    {name = "Arowosegbe Victor Iyanuoluwa",email = "iyanuvicky@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "counter (>=1.0.0,<2.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "polars (>=1.39.2,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fastexcel (>=0.19.0,<0.20.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "docx (>=0.2.4,<0.3.0)",
    "stargazer (>=0.0.7,<0.0.8)",
    "modelsummary (>=1.1.7,<2.0.0)",
    "scikit-posthocs (>=0.14.0,<0.15.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
mypy = "^1.20.0"
ipykernel = "^7.3.0"


[tool.poetry.group.statistics.dependencies]
scipy = "^1.17.1"
statsmodels = "^0.14.6"
jinja2 = "^3.1.6"


[tool.poetry.group.visualization.dependencies]
matplotlib = "^3.10.9"
seaborn = "^0.13.2"

